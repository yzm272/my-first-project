<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>AI 红后 智能问答OK</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
        background: url('3.jpg') no-repeat  ;
          font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
<!--          background: #0a0a12;-->
          color: #00f3ff;
          height: 100vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
            background-size: cover;    /* 关键属性：完整包含图片 */
            ;    /* 关键属性：完整包含图片 */

        }
        .header {
          padding: 1rem;
          text-align: center;
          border-bottom: 1px solid #00f3ff;
          box-shadow: 0 0 10px #00f3ff;
        }
        .header h1 {
          font-size: 2.2rem;
          letter-spacing: 2px;
          text-shadow: 0 0 10px #00f3ff;
        }
        .chat-container {
          flex: 1;
          padding: 1.5rem;
          overflow-y: auto;
          max-height: 70vh;
        }
        .chat-box {
<!--          background: rgba(10, 10, 18, 0.7);-->
          border: 1px solid #00f3ff;
          border-radius: 10px;
          padding: 1.5rem;
          box-shadow: 0 0 15px #00f3ff;
          height: 100%;
          overflow-y: auto;
        }
        .message {
          margin-bottom: 1.2rem;
          padding: 0.8rem 1.2rem;
          border-radius: 8px;
          max-width: 85%;
          animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
          background: #00f3ff;
          color: #0a0a12;
          margin-left: auto;
          border-bottom-right-radius: 2px;
        }
        .agent-message {
          background: rgba(0, 243, 255, 0.1);
          color: #00f3ff;
          border: 1px solid #00f3ff;
          margin-right: auto;
          border-bottom-left-radius: 2px;
        }
        .input-container {
          padding: 1rem;
          display: flex;
          gap: 1rem;
        }
        .input-box {
          flex: 1;
          background: rgba(10, 10, 18, 0.7);
          border: 1px solid #00f3ff;
          border-radius: 8px;
          padding: 0.8rem 1.2rem;
          color: #00f3ff;
          font-size: 1.1rem;
          outline: none;
          box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }
        .input-box:focus {
          box-shadow: 0 0 15px #00f3ff;
        }
        .send-btn {
          background: #00f3ff;
          color: #0a0a12;
          border: none;
          border-radius: 8px;
          padding: 0.8rem 1.5rem;
          font-size: 1.1rem;
          cursor: pointer;
          transition: all 0.2s;
          font-weight: bold;
        }
        .send-btn:hover {
          transform: scale(1.05);
          box-shadow: 0 0 20px #00f3ff;
        }
        .scrollbar {
          width: 100%;
          height: 8px;
          background: #0a0a12;
          border-radius: 4px;
          margin-top: 5px;
        }
        .scrollbar-thumb {
          height: 100%;
          background: #00f3ff;
          border-radius: 4px;
        }
        ::-webkit-scrollbar {
          width: 10px;
        }
        ::-webkit-scrollbar-track {
          background: rgba(10, 10, 18, 0.5);
        }
        ::-webkit-scrollbar-thumb {
          background: #00f3ff;
          border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #00bfff;
        }
        .agent-icon {
          display: inline-block;
          width: 24px;
          height: 24px;
          background: #00f3ff;
          border-radius: 50%;
          margin-right: 8px;
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.7; }
          100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>AI 生化危机红后智能问答系统</h1>
</div>
<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message agent-message">
            <span class="agent-icon"></span>您好！我是AI Agent，随时为您解答问题。
        </div>
    </div>
</div>
<div class="input-container">
    <input type="text" class="input-box" id="userInput" placeholder="输入您的问题...">
    <button class="send-btn" id="sendBtn">发送</button>
</div>

               success: function(data) {
                console.log(119);
                    console.log(data);
                    $ ('#result').text(JSON.stringify(data, null, 2));
               },

           });

<!--                method: 'GET',-->

<!--                success: function(response) {-->
<!--                    $('#result').text('服务器响应: ' + response);-->
<!--                },-->
<!--                error: function(xhr, status, error) {-->

        });

</script>
<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(message, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user-message' : 'agent-message'}`;

      if (isUser) {
        messageDiv.innerHTML = message;
      } else {
        messageDiv.innerHTML = `<span class="agent-icon"></span>${message}`;
      }

      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {


      const message = userInput.value.trim();

      if (message) {
        addMessage(message, true);

           console.log(message);
            $.ajax({
               url: 'http://localhost:8081/hello/streamchat',
               type: 'GET',
               contentType: 'application/x-www-form-urlencoded',
               data: { id: 1, msg:message },
               success: function(data) {
                console.log(119);
                    console.log(data);
                    addMessage(data)
<!--                    $ ('#result').text(JSON.stringify(data, null, 2));-->
               },
               })
        userInput.value = '';
        // 模拟AI回复
        setTimeout(() => {
          const responses = [
            "这个问题很有趣，让我思考一下...",
            "根据我的分析，答案是...",
            "我理解您的问题，让我为您解答...",
            "这是一个值得深入探讨的话题..."
          ];
          const randomResponse = responses[Math.floor(Math.random() * responses.length)];
          addMessage(randomResponse);
        }, 1000);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
</script>
</body>
</html>
